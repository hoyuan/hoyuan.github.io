<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 1. 完美適配 iPhone 螢幕，禁止雙指縮放，填滿安全區域 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- 2. 加入 Web App 支援，允許加到主畫面時隱藏 Safari 導覽列 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>DropHoyuan</title>

    <style>
        /* --- iOS 系統顏色變數定義 --- */
        :root {
            --bg-color: #F2F2F7; /* iOS 淺色背景 */
            --card-bg: #FFFFFF;
            --text-primary: #000000;
            --text-secondary: #8E8E93;
            --separator: #C6C6C8;
            --blue: #007AFF;
        }

        /* 自動支援 iPhone 深色模式 (Dark Mode) */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #1C1C1E; /* iOS 深色卡片底色 */
                --text-primary: #FFFFFF;
                --text-secondary: #EBEBF5;
                --separator: #38383A;
                --blue: #0A84FF;
            }
        }

        /* --- 基礎排版 --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro TC", "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            /* 避開 iPhone 動態島與底部橫條 */
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
            -webkit-font-smoothing: antialiased;
        }

        /* --- 大標題與 IP 小工具 --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin: 24px 0 16px 4px;
        }
        h1 {
            font-size: 34px;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.41px;
        }
        .ip-widget {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: right;
        }

        /* --- iOS 分組列表 (Inset Grouped List) --- */
        .section-title {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin: 24px 0 8px 16px;
        }

        .list-group {
            background-color: var(--card-bg);
            border-radius: 10px; /* iOS 原生圓角 */
            overflow: hidden;
            margin-bottom: 24px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            min-height: 44px; /* 符合 HIG 最小觸控熱區 */
            text-decoration: none;
            color: var(--text-primary);
            font-size: 17px;
            border-bottom: 0.5px solid var(--separator);
            transition: background-color 0.2s ease;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        /* 點擊時的反饋效果 */
        .list-item:active {
            background-color: rgba(142, 142, 147, 0.2);
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-icon {
            font-size: 22px; /* 用 Emoji 暫代 Icon */
        }

        /* iOS 右側小箭頭 */
        .chevron::after {
            content: "›";
            font-size: 24px;
            color: var(--text-secondary);
            font-family: "Helvetica Neue";
            line-height: 0;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <!-- 頂部標題與 IP 顯示 -->
    <header class="header">
        <h1>Hoyuan</h1>
        <div class="ip-widget">
            My IP<br>
            <span id="ipaddr" style="color: var(--blue); font-weight: 600;">Detecting...</span>
        </div>
    </header>

    <!-- 分組 1：AI 工具 -->
    <div class="section-title">AI & Search</div>
    <div class="list-group">
        <a href="https://chatgpt.com/" class="list-item">
            <div class="item-left"><span class="item-icon">🤖</span> ChatGPT</div>
            <div class="chevron"></div>
        </a>
        <a href="https://claude.ai/" class="list-item">
            <div class="item-left"><span class="item-icon">🧠</span> Claude</div>
            <div class="chevron"></div>
        </a>
        <a href="https://drive.google.com/drive/my-drive" class="list-item">
            <div class="item-left"><span class="item-icon">☁️</span> Google Drive</div>
            <div class="chevron"></div>
        </a>
    </div>

    <!-- 分組 2：交通資訊 -->
    <div class="section-title">Transit & Weather</div>
    <div class="list-group">
        <a href="http://twtraffic.tra.gov.tw/twrail/mobile/home.aspx" class="list-item">
            <div class="item-left"><span class="item-icon">🚂</span> 台鐵時刻表</div>
            <div class="chevron"></div>
        </a>
        <a href="http://www.thsrc.com.tw/" class="list-item">
            <div class="item-left"><span class="item-icon">🚅</span> 台灣高鐵</div>
            <div class="chevron"></div>
        </a>
        <a href="https://www.mtaxi.com.tw/taxi-fare-estimate/" class="list-item">
            <div class="item-left"><span class="item-icon">🚕</span> 計程車車資試算</div>
            <div class="chevron"></div>
        </a>
        <a href="https://www.cwb.gov.tw/V8/C/P/Rainfall/Rainfall_QZJ.html" class="list-item">
            <div class="item-left"><span class="item-icon">☔️</span> 中央氣象局雨量</div>
            <div class="chevron"></div>
        </a>
    </div>

    <!-- 分組 3：圖書館與電子書 -->
    <div class="section-title">Library & eBooks</div>
    <div class="list-group">
        <a href="http://lib.ebookservice.tw/ks" class="list-item">
            <div class="item-left"><span class="item-icon">📚</span> 台灣雲端書庫 (高雄)</div>
            <div class="chevron"></div>
        </a>
        <a href="http://ksml.ebook.hyread.com.tw/?" class="list-item">
            <div class="item-left"><span class="item-icon">📱</span> HyRead (高雄)</div>
            <div class="chevron"></div>
        </a>
    </div>

    <!-- 載入你原本的 jQuery (抓 IP 用) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script>
        // IP 抓取功能保留
        $.getJSON("https://api.ipify.org?format=json", function(data) { 
            $("#ipaddr").html(data.ip);     
        });

        // 鍵盤快捷鍵功能保留 (雖然 iPhone 沒外接鍵盤用不到，但在 iPad/Mac 上還是很實用)
        function handleKeyPress(evt) {
            var nbr = (window.event) ? event.keyCode : evt.which;
            var snbr = String.fromCharCode(nbr).toUpperCase();
            
            const shortcuts = {
                'C': 'https://chatgpt.com/',
                'D': 'https://drive.google.com/drive/my-drive',
                'G': 'http://www.google.com.tw/',
                'F': 'https://www.facebook.com/',
                'Y': 'http://www.youtube.com/'
                // 可以繼續補齊你的快捷鍵
            };

            if (shortcuts[snbr]) {
                location.href = shortcuts[snbr];
            }
        }
        document.onkeydown = handleKeyPress;
    </script>
</body>
</html>
