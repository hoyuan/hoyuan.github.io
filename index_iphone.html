        /* --- iOS 系統顏色變數定義 --- */
        :root {
            --bg-color: #F2F2F7; /* iOS 淺色背景 */
            --card-bg: #FFFFFF;
            --text-primary: #000000;
            --text-secondary: #8E8E93;
            --separator: #C6C6C8;
            --blue: #007AFF;
            /* --- 字型參數預設值，可透過 URL 參數覆蓋 --- */
            --font-family-base: "Microsoft JhengHei", "微軟正黑體", -apple-system, BlinkMacSystemFont, sans-serif;
            --font-scale: 1;
            --font-size-base: 28px;
            --font-size-body: calc(var(--font-size-base) * var(--font-scale));
            --font-size-h1: calc(var(--font-size-base) * var(--font-scale));
            --font-size-meta: calc(var(--font-size-base) * var(--font-scale));
            --font-size-item: calc(var(--font-size-base) * var(--font-scale));
            --font-size-icon: calc(var(--font-size-base) * var(--font-scale));
            --font-size-chevron: calc(var(--font-size-base) * var(--font-scale));
        }

        /* 自動支援 iPhone 深色模式 (Dark Mode) */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #1C1C1E; /* iOS 深色卡片底色 */
                --text-primary: #FFFFFF;
                --text-secondary: #EBEBF5;
                --separator: #38383A;
                --blue: #0A84FF;
            }
        }

        /* --- 基礎排版 --- */
        body {
            font-family: var(--font-family-base);
            font-size: var(--font-size-body);
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            /* 避開 iPhone 動態島與底部橫條 */
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
            -webkit-font-smoothing: antialiased;
        }

        /* --- 大標題與 IP 小工具 --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin: 24px 0 16px 4px;
        }
        h1 {
            font-size: var(--font-size-h1);
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.41px;
        }
        .ip-widget {
            font-size: var(--font-size-meta);
            color: var(--text-secondary);
            text-align: right;
        }

        /* --- iOS 分組列表 (Inset Grouped List) --- */
        .section-title {
            font-size: var(--font-size-meta);
            color: var(--text-secondary);
            text-transform: uppercase;
            margin: 24px 0 8px 16px;
        }

        .list-group {
            background-color: var(--card-bg);
            border-radius: 10px; /* iOS 原生圓角 */
            overflow: hidden;
            margin-bottom: 24px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            min-height: 44px; /* 符合 HIG 最小觸控熱區 */
            text-decoration: none;
            color: var(--text-primary);
            font-size: var(--font-size-item);
            border-bottom: 0.5px solid var(--separator);
            transition: background-color 0.2s ease;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        /* 點擊時的反饋效果 */
        .list-item:active {
            background-color: rgba(142, 142, 147, 0.2);
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-icon {
            font-size: var(--font-size-icon); /* 用 Emoji 暫代 Icon */
        }

        /* iOS 右側小箭頭 */
        .chevron::after {
            content: "›";
            font-size: var(--font-size-chevron);
            color: var(--text-secondary);
            font-family: "Helvetica Neue";
            line-height: 0;
            margin-bottom: 4px;
        }
    </style>
</head>

    <!-- 載入你原本的 jQuery (抓 IP 用) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script>
        // 允許透過 URL 參數調整整頁字型
        // 範例：
        //   index_iphone.html?fontScale=1.15
        //   index_iphone.html?fontFamily=Arial,%20sans-serif&fontScale=0.95
        (function applyFontParams() {
            const params = new URLSearchParams(window.location.search);
            const fontScale = parseFloat(params.get("fontScale") || params.get("scale"));
            const fontFamily = params.get("fontFamily") || params.get("font");

            if (!Number.isNaN(fontScale) && fontScale > 0) {
                document.documentElement.style.setProperty("--font-scale", String(fontScale));
            }

            if (fontFamily) {
                document.documentElement.style.setProperty("--font-family-base", fontFamily);
            }
        })();

        // IP 抓取功能保留
        $.getJSON("https://api.ipify.org?format=json", function(data) { 
            $("#ipaddr").html(data.ip);     
        });

        // 鍵盤快捷鍵功能保留 (雖然 iPhone 沒外接鍵盤用不到，但在 iPad/Mac 上還是很實用)
        function handleKeyPress(evt) {
            var nbr = (window.event) ? event.keyCode : evt.which;
            var snbr = String.fromCharCode(nbr).toUpperCase();
            
            const shortcuts = {
                'D': 'https://drive.google.com/drive/my-drive',
                'G': 'http://www.google.com.tw/',
                'F': 'https://www.facebook.com/',
                'Y': 'http://www.youtube.com/'
                // 可以繼續補齊你的快捷鍵
            };

            if (shortcuts[snbr]) {
                location.href = shortcuts[snbr];
            }
        }
        document.onkeydown = handleKeyPress;
    </script>
